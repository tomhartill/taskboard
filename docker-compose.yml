# Optional: Postgres for local development. `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    ports:
      - '5432:5432'
    volumes:
      - taskboard-db:/var/lib/postgresql/data
volumes:
  taskboard-db:
